data:
  raw_dir: "data/raw/"
  processed_dir: "data/processed/"
  mappings_dir: "data/mappings/"
  review_dir: "data/review/"
  reference_dir: "data/reference/"
  corrections_dir: "data/corrections/"
  max_samples: 280000  # Optional preprocessing sample cap
  use_business_name: true
  text_separator: " | "

model:
  name: "distilroberta-base"
  max_seq_length: 160
  device: "auto"  # auto, cpu, cuda, mps

training:
  batch_size: 32
  epochs: 10
  learning_rate: 3.5e-5
  early_stopping_patience: 2
  gradient_accumulation_steps: 2
  mixed_precision: true
  enable_optimizations: true
  subset_threshold: 180000  # Apply subset sampling when dataset exceeds this size (optional)
  subset_size: null         # Override to force a specific subset size
  subset_seed: 42
  force_update_best: false
  memory:
    min_required_gb: 1.5
    max_usage_percentage: 0.5
    cleanup_frequency: 25
  dataloader_opts:
    num_workers: 0
    pin_memory: false
    persistent_workers: false
    prefetch_factor: 2

logging:
  dir: "logs/"
  level: "INFO"
  style: "rich"
  log_batch_frequency: 10

output:
  model_dir: "models/"
  best_model_dir: "models/best_model/"

prediction:
  explain: false
  confidence_threshold: 0.0

evaluation:
  auto_evaluate: true
  save_confusion_matrix: true
  save_class_performance: true
  save_misclassifications: true
  metrics_to_track:
    - accuracy
    - f1
    - top3_accuracy
